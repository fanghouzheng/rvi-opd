[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rvi-opd"
version = "0.1.0"
description = "Auditable experiment scaffold for Repair-vs-Intervene On-Policy Distillation"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "RvI-OPD contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.16.5,<0.17"]
hf = ["torch>=2.5", "transformers>=4.55", "datasets>=3.0"]

[project.scripts]
rvi-opd = "rvi_opd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
