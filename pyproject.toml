[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "rvi-opd"
version = "0.1.0"
description = "Auditable experiment scaffold for Repair-vs-Intervene On-Policy Distillation"
readme = "README.md"
requires-python = ">=3.9,<3.13"
authors = [{name = "RvI-OPD contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.5"]

[project.scripts]
rvi-opd = "rvi_opd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
