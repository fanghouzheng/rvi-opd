name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint Python sources and tests
        run: make lint
      - name: Validate experiment configs
        run: make validate
      - name: Run tests
        run: make test
      - name: Run deterministic smoke
        run: make smoke
      - name: Verify installed console entry point outside the checkout
        run: |
          cd /tmp
          rvi-opd smoke --output /tmp/rvi-opd-installed-smoke
          test -s /tmp/rvi-opd-installed-smoke/report.json
